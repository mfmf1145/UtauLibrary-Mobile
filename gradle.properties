# 本机 Java 路径：不同机器不一样，默认不写死。需要时用 JAVA_HOME 或
# org.gradle.java.home=... 指定

org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# 常驻 daemon + 构建缓存：单个 Kotlin 文件改动从 3~4 分钟降到 1 分钟左右
org.gradle.daemon=true
org.gradle.caching=true
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official
# arm64 host: use the native arm64 aapt2 instead of the x86_64 maven artifact
# 只给 arm64 构建机用：x86_64 机器不要开这行
# android.aapt2FromMavenOverride=/opt/android-tools/aapt2
